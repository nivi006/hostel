<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Samiksha Hostel</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="login-container">
        <h2>Admin Login</h2>

        <form id="adminLoginForm">
            <input
                type="text"
                id="userid"
                placeholder="User ID"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <p id="errorMessage"></p>

            <button type="submit">Login</button>
        </form>
    </div>

    <script src="admin.js"></script>
</body>
</html>
