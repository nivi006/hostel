<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samiksha Hostel | New Registration</title>
    <link rel="stylesheet" href="apply.css">
     <link rel="stylesheet" href="style.css">
     <script src="guard.js"></script>
</head>

<body>

    <div class="registration-container">

        <div class="registration-header">
            <a href="home.html" class="back-home">← Back to Home</a>
            <h1>Samiksha <span>Hostel</span></h1>
            <p>New Student Registration</p>
            <h2>Create Your Account</h2>
            <p>Fill in your details to register with Samiksha Hostel.</p>
        </div>

        <form id="registrationForm">

            <h3>Personal Information</h3>

            <div class="form-row">

                <div class="input-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullname" placeholder="Enter full name" required>
                </div>

                <div class="input-group">
                    <label>Date of Birth *</label>
                    <input type="date" id="dob" required>
                </div>

            </div>

            <div class="form-row">

                <div class="input-group">
                    <label>Gender *</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Mobile Number *</label>
                    <input type="tel" id="mobile" placeholder="Enter mobile number"
                           pattern="[0-9]{10}" maxlength="10" required>
                </div>

            </div>

            <div class="input-group">
                <label>Email Address *</label>
                <input type="email" id="email" placeholder="Enter email address" required>
            </div>

            <div class="input-group">
                <label>Permanent Address *</label>
                <textarea id="address" rows="3" placeholder="Enter your address" required></textarea>
            </div>


            <h3>Academic Information</h3>

            <div class="form-row">

                <div class="input-group">
                    <label>College / University *</label>
                    <input type="text" id="college" placeholder="Enter college name" required>
                </div>

                <div class="input-group">
                    <label>Course *</label>
                    <input type="text" id="course" placeholder="Enter course name" required>
                </div>

            </div>

            <div class="form-row">

                <div class="input-group">
                    <label>Year of Study *</label>
                    <select id="year" required>
                        <option value="">Select Year</option>
                        <option>First Year</option>
                        <option>Second Year</option>
                        <option>Third Year</option>
                        <option>Fourth Year</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Parent / Guardian Name *</label>
                    <input type="text" id="parent" placeholder="Enter guardian name" required>
                </div>

            </div>


            <h3>Hostel Information</h3>

            <div class="form-row">

                <div class="input-group">
                    <label>Hostel Type *</label>
                    <select id="hostelType" required>
                        <option value="">Select Hostel</option>
                        <option value="Boys Hostel">Boys Hostel</option>
                        <option value="Girls Hostel">Girls Hostel</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Room Type *</label>
                    <select id="roomType" required>
                        <option value="">Select Room Type</option>
                        <option>Single Sharing</option>
                        <option>Double Sharing</option>
                        <option>Triple Sharing</option>
                        <option>Four Sharing</option>
                    </select>
                </div>

            </div>

            <div class="input-group">
                <label>Expected Joining Date *</label>
                <input type="date" id="joiningDate" required>
            </div>


            <h3>Create Login Credentials</h3>

            <div class="input-group">
                <label>Create Password *</label>
                <input type="password" id="password" placeholder="Create password"
                       minlength="8" required>
            </div>

            <div class="input-group">
                <label>Confirm Password *</label>
                <input type="password" id="confirmPassword"
                       placeholder="Confirm password" required>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the hostel rules and regulations.</label>
            </div>

            <button type="submit" class="submit-btn">Register Now</button>

            <p id="message"></p>

            <div class="login-link">
                Already registered? <a href="login.html">Login Here</a>
            </div>

        </form>

    </div>

    <script src="applynow.js"></script>

</body>
</html>
